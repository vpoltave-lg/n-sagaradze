<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Дія фон v5 — швидша анімація</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #eef3f7;
      overflow-x: hidden;
    }

    .diia {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(165deg, #e5f6f1 0%, #e8f0f8 45%, #f0ebf7 100%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      opacity: 0.8;
    }

    .b1 {
      width: 110vw;
      height: 75vh;
      background: radial-gradient(circle at 35% 40%, #6fd9b8 0%, #9aecd4 50%, transparent 72%);
      top: -20%;
      left: -25%;
    }

    .b2 {
      width: 95vw;
      height: 70vh;
      background: radial-gradient(circle at 60% 45%, #7ec3f0 0%, #a8d8f5 55%, transparent 75%);
      top: -5%;
      right: -30%;
    }

    .b3 {
      width: 85vw;
      height: 60vh;
      background: radial-gradient(circle at 50% 50%, #f2b8c9 0%, #f7d0db 55%, transparent 78%);
      top: 28%;
      left: 10%;
      opacity: 0.58;
      filter: blur(70px);
    }

    .b4 {
      width: 120vw;
      height: 80vh;
      background: radial-gradient(circle at 45% 60%, #b59aef 0%, #d0c0f5 50%, transparent 74%);
      bottom: -25%;
      left: -20%;
    }

    .b5 {
      width: 90vw;
      height: 65vh;
      background: radial-gradient(circle at 55% 70%, #c9a8e8 0%, #e0d0f2 60%, transparent 78%);
      bottom: -15%;
      right: -25%;
      opacity: 0.62;
    }

    .content {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 26px;
      padding: 30px 26px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 18px 45px rgba(0,0,0,0.07);
      border: 1px solid rgba(255,255,255,0.75);
      text-align: center;
    }

    h1 {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1e293b;
    }

    p {
      font-size: 14.5px;
      line-height: 1.5;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="diia">
    <div class="blob b1" id="b1"></div>
    <div class="blob b2" id="b2"></div>
    <div class="blob b3" id="b3"></div>
    <div class="blob b4" id="b4"></div>
    <div class="blob b5" id="b5"></div>
  </div>

  <div class="content">
    <div class="card">
      <h1>Дія v5</h1>
      <p>Анімація прискорена приблизно в 2–2.5 рази. Має бути добре видно.</p>
    </div>
  </div>

  <script>
    const items = [
      { id: 'b1', speed: 1.35, ampX: 95, ampY: 55, phase: 0.0 },
      { id: 'b2', speed: 1.65, ampX: 110, ampY: 70, phase: 2.1 },
      { id: 'b3', speed: 1.90, ampX: 80, ampY: 60, phase: 4.0 },
      { id: 'b4', speed: 1.20, ampX: 115, ampY: 80, phase: 1.2 },
      { id: 'b5', speed: 1.45, ampX: 100, ampY: 70, phase: 3.3 }
    ].map(c => ({ ...c, el: document.getElementById(c.id) }));

    let mx = 0, my = 0, cx = 0, cy = 0;

    window.addEventListener('mousemove', e => {
      mx = (e.clientX / innerWidth - 0.5) * 2;
      my = (e.clientY / innerHeight - 0.5) * 2;
    }, { passive: true });

    window.addEventListener('deviceorientation', e => {
      if (e.gamma != null && e.beta != null) {
        mx = Math.max(-1, Math.min(1, e.gamma / 28));
        my = Math.max(-1, Math.min(1, (e.beta - 42) / 28));
      }
    }, { passive: true });

    const t0 = performance.now();

    function tick(now) {
      const t = (now - t0) * 0.001;

      cx += (mx - cx) * 0.06;
      cy += (my - cy) * 0.06;

      items.forEach((item, i) => {
        const x = Math.sin(t * item.speed + item.phase) * item.ampX
                + Math.sin(t * item.speed * 0.7 + item.phase * 1.3) * item.ampX * 0.4
                + cx * (28 + i * 12);

        const y = Math.cos(t * item.speed * 0.95 + item.phase * 0.7) * item.ampY
                + Math.cos(t * item.speed * 0.6 + item.phase) * item.ampY * 0.35
                + cy * (22 + i * 10);

        const scale = 1 + Math.sin(t * 0.45 + item.phase) * 0.09;

        item.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${scale.toFixed(4)})`;
      });

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
