<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фон у стилі Дії — живий перелив</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
    }

    .diia-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(158deg, #dff5ec 0%, #e4eefc 45%, #ece2ff 100%);
      pointer-events: none;
    }

    /* Діагональний нахил зони поділу кольорів */
    .diia-angled-stage {
      position: absolute;
      inset: -30%;
      transform: rotate(-14deg);
      transform-origin: center center;
    }

    .blob-wrap {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .diia-blob {
      position: absolute;
      border-radius: 48% 52% 51% 49% / 46% 49% 51% 54%;
      filter: blur(80px);
      opacity: 0.88;
      will-change: transform, background-position;
      background-size: 140% 140%;
    }

    /* Верхньо-лівий м'ятно-зелений */
    .blob-top-green {
      width: 85vw;
      height: 58vh;
      min-width: 360px;
      min-height: 260px;
      background: radial-gradient(circle at 30% 35%, #7de0b8 0%, #a8f0dc 55%, transparent 78%);
      top: 0%;
      left: -12%;
    }

    /* Центральний блакитно-персиковий */
    .blob-mid-accent {
      width: 78vw;
      height: 50vh;
      min-width: 340px;
      min-height: 240px;
      background: radial-gradient(circle at 55% 45%, #8ecfff 0%, #ffc8d6 60%, transparent 80%);
      top: 26%;
      right: -14%;
    }

    /* Нижній фіолетово-бузковий */
    .blob-bottom-violet {
      width: 90vw;
      height: 60vh;
      min-width: 380px;
      min-height: 280px;
      background: radial-gradient(circle at 50% 60%, #b9a0ff 0%, #d6c8ff 58%, transparent 78%);
      bottom: -4%;
      left: 2%;
    }

    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      padding: 28px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .card h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      line-height: 1.55;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="diia-bg" aria-hidden="true">
    <div class="diia-angled-stage">
      <div class="blob-wrap" data-depth="0.06">
        <div class="diia-blob blob-top-green"></div>
      </div>
      <div class="blob-wrap" data-depth="-0.07">
        <div class="diia-blob blob-mid-accent"></div>
      </div>
      <div class="blob-wrap" data-depth="0.055">
        <div class="diia-blob blob-bottom-violet"></div>
      </div>
    </div>
  </div>

  <main class="demo-content">
    <div class="card">
      <h1>Живий перелив кольорів</h1>
      <p>Кольори тепер активно і плавно перетікають один в одного. Миша та гіроскоп додають додатковий зсув.</p>
    </div>
  </main>

  <script>
    (() => {
      const wraps = document.querySelectorAll('.diia-bg .blob-wrap');
      const blobs = document.querySelectorAll('.diia-bg .diia-blob');
      if (!wraps.length || !blobs.length) return;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      const maxShift = 180;

      // Значно помітніші параметри руху
      const motionConfigs = [
        { speedX: 0.00085, speedY: 0.00062, ampX: 95, ampY: 55, phase: 0.0,  scaleAmp: 0.11, bgSpeed: 0.00028 },
        { speedX: 0.00072, speedY: 0.00095, ampX: 110, ampY: 68, phase: 2.4, scaleAmp: 0.13, bgSpeed: 0.00035 },
        { speedX: 0.00078, speedY: 0.00058, ampX: 100, ampY: 52, phase: 4.7, scaleAmp: 0.10, bgSpeed: 0.00031 }
      ];

      window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });

      const handleOrientation = (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gamma = Math.max(-35, Math.min(35, e.gamma));
        const beta = Math.max(-35, Math.min(35, e.beta - 45));
        targetX = gamma / 35;
        targetY = beta / 35;
      };

      const initGyro = () => {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          DeviceOrientationEvent.requestPermission()
            .then((state) => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, { passive: true });
              }
            })
            .catch(() => {});
        } else {
          window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        }
        window.removeEventListener('touchstart', initGyro);
      };

      window.addEventListener('touchstart', initGyro, { passive: true });

      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission !== 'function'
      ) {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
      }

      const animate = (now) => {
        currentX += (targetX - currentX) * 0.07;
        currentY += (targetY - currentY) * 0.07;

        for (let i = 0; i < wraps.length; i++) {
          const depth = parseFloat(wraps[i].dataset.depth) || 0.05;
          const moveX = (currentX * maxShift * depth * 10).toFixed(2);
          const moveY = (currentY * maxShift * depth * 10).toFixed(2);
          wraps[i].style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;

          const cfg = motionConfigs[i] || motionConfigs[0];
          const driftX = (Math.sin(now * cfg.speedX + cfg.phase) * cfg.ampX).toFixed(2);
          const driftY = (Math.cos(now * cfg.speedY + cfg.phase * 0.7) * cfg.ampY).toFixed(2);
          const scale = (1 + Math.sin(now * cfg.speedX * 0.75 + cfg.phase) * cfg.scaleAmp).toFixed(4);

          // Додатковий рух градієнта всередині плями — саме це дає відчуття «переливу» кольорів
          const bgX = (50 + Math.sin(now * cfg.bgSpeed + cfg.phase) * 22).toFixed(1);
          const bgY = (50 + Math.cos(now * cfg.bgSpeed * 1.15 + cfg.phase * 0.8) * 18).toFixed(1);

          blobs[i].style.transform = `translate3d(${driftX}px, ${driftY}px, 0) scale(${scale})`;
          blobs[i].style.backgroundPosition = `${bgX}% ${bgY}%`;
        }

        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
