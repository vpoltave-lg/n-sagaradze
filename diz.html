<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фон у стилі Дії — точний дрейф по відео</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      overflow-x: hidden;
    }

    /* Контейнер фону (завжди на весь екран) */
    .diia-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* Шар анімованого градієнту (в 3 рази більше екрану для циклічного руху) */
    .diia-gradient-layer {
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      /* Точна палітра: фіолетовий -> блакитний -> жовтий -> фіолетовий */
      background: linear-gradient(
        158deg,
        #b6a0df 0%,
        #d4eef6 50%,
        #f3ebba 75%,
        #b6a0df 100%
      );
      /* Розмиття для м'якості переходів */
      filter: blur(45px);
      /* Безперервна повільна анімація дрейфу за 24 секунди (один повний цикл візерунка за ~5 сек) */
      animation: driftBackground 24s linear infinite;
      will-change: transform;
      /* Додаємо прозорість, щоб вона не була надто насиченою */
      opacity: 0.95;
    }

    /* Циклічний рух фонової картинки */
    @keyframes driftBackground {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        transform: translate(50px, 50px) rotate(0.1deg); /* Легкий діагональний дрейф */
      }
    }

    /* Внутрішній додатковий шар для мерехтіння (пульсації прозорості) */
    .diia-shine-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.6) 0%, transparent 60%),
                  radial-gradient(circle at 60% 40%, rgba(210, 238, 248, 0.5) 0%, transparent 70%);
      animation: pulseShine 6s ease-in-out infinite alternate;
      opacity: 0.6;
    }

    @keyframes pulseShine {
      0% { opacity: 0.4; }
      100% { opacity: 0.75; }
    }

    /* Демо-картка як у Дії */
    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 360px;
      width: 100%;
      aspect-ratio: 3 / 4;
      padding: 28px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(31, 41, 55, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4b5563;
    }
  </style>
</head>
<body>

  <div class="diia-bg" aria-hidden="true">
    <div class="diia-gradient-layer"></div>
    <div class="diia-shine-layer"></div>
  </div>

  <main class="demo-content">
    <div class="card">
      <h1>Дрейфуючий фон Дія</h1>
      <p>Плавний діагональний перелив із безперервною анімацією, що імітує рух на відео.</p>
    </div>
  </main>

</body>
</html>
