<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фон у стилі Дії — безперервний перелив</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
    }

    .diia-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(158deg, #dff5ec 0%, #e4eefc 52%, #ece2ff 100%);
      pointer-events: none;
    }

    /* Діагональний нахил зони поділу кольорів */
    .diia-angled-stage {
      position: absolute;
      inset: -25%;
      transform: rotate(-14deg);
      transform-origin: center center;
    }

    .blob-wrap {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .diia-blob {
      position: absolute;
      border-radius: 46% 54% 52% 48% / 44% 48% 52% 56%;
      filter: blur(75px);
      opacity: 0.85;
      will-change: transform;
    }

    /* Верхньо-лівий м'ятно-зелений масив */
    .blob-top-green {
      width: 78vw;
      height: 52vh;
      min-width: 340px;
      min-height: 240px;
      background: radial-gradient(circle at 30% 35%, #9be7c4 0%, #b8f2e6 60%, transparent 75%);
      top: 4%;
      left: -8%;
    }

    /* Центральний блакитно-персиковий перехід під кутом */
    .blob-mid-accent {
      width: 72vw;
      height: 44vh;
      min-width: 320px;
      min-height: 220px;
      background: radial-gradient(circle at 60% 50%, #a8d8ff 0%, #ffd9e2 65%, transparent 78%);
      top: 30%;
      right: -10%;
    }

    /* Нижній фіолетово-бузковий масив */
    .blob-bottom-violet {
      width: 82vw;
      height: 56vh;
      min-width: 360px;
      min-height: 260px;
      background: radial-gradient(circle at 55% 65%, #c7b2ff 0%, #dfd2ff 62%, transparent 76%);
      bottom: 2%;
      left: 6%;
    }

    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      padding: 28px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .card h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      line-height: 1.55;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="diia-bg" aria-hidden="true">
    <div class="diia-angled-stage">
      <div class="blob-wrap" data-depth="0.045">
        <div class="diia-blob blob-top-green"></div>
      </div>
      <div class="blob-wrap" data-depth="-0.055">
        <div class="diia-blob blob-mid-accent"></div>
      </div>
      <div class="blob-wrap" data-depth="0.05">
        <div class="diia-blob blob-bottom-violet"></div>
      </div>
    </div>
  </div>

  <main class="demo-content">
    <div class="card">
      <h1>Постійний перелив у JS</h1>
      <p>Кольори плавно перетікають навіть без нахилу пристрою та в режимі економії енергії, а миша й гіроскоп додають додатковий зсув.</p>
    </div>
  </main>

  <script>
    (() => {
      const wraps = document.querySelectorAll('.diia-bg .blob-wrap');
      const blobs = document.querySelectorAll('.diia-bg .diia-blob');
      if (!wraps.length || !blobs.length) return;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      const maxShift = 160;

      // Індивідуальні параметри плавного перетікання для кожного плямистого шару
      const motionConfigs = [
        { speedX: 0.00042, speedY: 0.00031, ampX: 65, ampY: 38, phase: 0.0, scaleAmp: 0.07 },
        { speedX: 0.00035, speedY: 0.00046, ampX: 75, ampY: 42, phase: 2.1, scaleAmp: 0.08 },
        { speedX: 0.00039, speedY: 0.00029, ampX: 70, ampY: 36, phase: 4.2, scaleAmp: 0.07 }
      ];

      window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });

      const handleOrientation = (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gamma = Math.max(-35, Math.min(35, e.gamma));
        const beta = Math.max(-35, Math.min(35, e.beta - 45));
        targetX = gamma / 35;
        targetY = beta / 35;
      };

      const initGyro = () => {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          DeviceOrientationEvent.requestPermission()
            .then((state) => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, { passive: true });
              }
            })
            .catch(() => {});
        } else {
          window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        }
        window.removeEventListener('touchstart', initGyro);
      };

      window.addEventListener('touchstart', initGyro, { passive: true });

      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission !== 'function'
      ) {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
      }

      const animate = (now) => {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;

        for (let i = 0; i < wraps.length; i++) {
          const depth = parseFloat(wraps[i].dataset.depth) || 0.05;
          const moveX = (currentX * maxShift * depth * 10).toFixed(2);
          const moveY = (currentY * maxShift * depth * 10).toFixed(2);
          wraps[i].style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;

          const cfg = motionConfigs[i] || motionConfigs[0];
          const driftX = (Math.sin(now * cfg.speedX + cfg.phase) * cfg.ampX).toFixed(2);
          const driftY = (Math.cos(now * cfg.speedY + cfg.phase * 0.7) * cfg.ampY).toFixed(2);
          const scale = (1 + Math.sin(now * cfg.speedX * 0.8 + cfg.phase) * cfg.scaleAmp).toFixed(4);

          blobs[i].style.transform = `translate3d(${driftX}px, ${driftY}px, 0) scale(${scale})`;
        }

        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
