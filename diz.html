<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фон у стилі Дії — точний дрейф по відео</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      overflow-x: hidden;
    }

    /* Контейнер фону */
    .diia-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* Шар анімованого градієнту (збільшений для циклічного руху) */
    .diia-gradient-layer {
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      /* Обновлений градієнт: більш виражений фіолетовий діагональний масив */
      background: linear-gradient(
        145deg, /* Діагональний кут, щоб фіолетовий дрейфував з верхнього правого до нижнього лівого */
        #d4eef6 0%,   /* Ніжно-блакитний (центр відео) */
        #f3ebba 33%,  /* Теплий кремово-жовтий (низ відео) */
        #b6a0df 66%,  /* Фіолетовий (верх відео) */
        #d4eef6 100%  /* Ніжно-блакитний (зациклення) */
      );
      filter: blur(55px); /* Трохи сильніше розмиття для м'якості */
      /* Анімація дрейфу за 20 секунд (сам фіолетовий масив проходить по екрану за ~5 сек) */
      animation: driftBackground 20s linear infinite alternate;
      will-change: transform;
      opacity: 0.88;
    }

    /* Циклічний рух фонової картинки — більш виражене діагональне плавання */
    @keyframes driftBackground {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      /* Зсув по діагоналі, який змушує фіолетову зону проходити через весь екран */
      100% {
        transform: translate(-100px, 120px) rotate(0.15deg);
      }
    }

    /* Шар для світіння (залишаємо як є, він м'яко доповнює) */
    .diia-shine-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 65%, rgba(255, 255, 255, 0.5) 0%, transparent 65%),
                  radial-gradient(circle at 65% 35%, rgba(210, 238, 248, 0.4) 0%, transparent 70%);
      animation: pulseShine 6s ease-in-out infinite alternate;
      opacity: 0.7;
    }

    @keyframes pulseShine {
      0% { opacity: 0.5; }
      100% { opacity: 0.85; }
    }

    /* Демо-картка як у Дії */
    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 360px;
      width: 100%;
      aspect-ratio: 3 / 4;
      padding: 28px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(31, 41, 55, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4b5563;
    }
  </style>
</head>
<body>

  <div class="diia-bg" aria-hidden="true">
    <div class="diia-gradient-layer"></div>
    <div class="diia-shine-layer"></div>
  </div>

  <main class="demo-content">
    <div class="card">
      <h1>Дрейфуючий фон Дія (v2)</h1>
      <p>Плавний діагональний перелив із циклічним дрейфом кольорів, включаючи фіолетовий внизу.</p>
    </div>
  </main>

</body>
</html>
