<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фон у стилі Дії — точний перелив 4 сек</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
    }

    /* Контейнер фону */
    .diia-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background-color: #e4eef5;
      pointer-events: none;
    }

    /* Шари, що реагують на рух миші / нахил телефону */
    .diia-layer {
      position: absolute;
      inset: -12%;
      will-change: transform, opacity;
    }

    /* Стан 1 (скріншот 1): верхній лівий лимонно-м'ятний -> блакитний -> нижній правий лавандовий */
    .layer-state-1 {
      background:
        radial-gradient(circle at 15% 18%, rgba(238, 245, 214, 0.95) 0%, rgba(238, 245, 214, 0) 58%),
        radial-gradient(circle at 82% 22%, rgba(210, 238, 248, 0.85) 0%, rgba(210, 238, 248, 0) 60%),
        radial-gradient(circle at 85% 84%, rgba(218, 210, 243, 0.95) 0%, rgba(218, 210, 243, 0) 62%),
        linear-gradient(148deg, #edf4d8 0%, #d8eff7 50%, #dcd4f2 100%);
      opacity: 1;
    }

    /* Стан 2 (скріншот 2): верхній лівий лавандовий -> блакитний -> нижній правий м'ятно-лимонний */
    .layer-state-2 {
      background:
        radial-gradient(circle at 18% 16%, rgba(216, 208, 242, 0.95) 0%, rgba(216, 208, 242, 0) 60%),
        radial-gradient(circle at 78% 72%, rgba(208, 238, 248, 0.85) 0%, rgba(208, 238, 248, 0) 60%),
        radial-gradient(circle at 22% 86%, rgba(239, 245, 213, 0.95) 0%, rgba(239, 245, 213, 0) 62%),
        linear-gradient(148deg, #dad2f0 0%, #d5eef6 52%, #edf4d8 100%);
      opacity: 0;
    }

    /* Приклад картки як у Дії */
    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      max-width: 360px;
      width: 100%;
      aspect-ratio: 3 / 4;
      padding: 28px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(31, 41, 55, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4b5563;
    }
  </style>
</head>
<body>

  <div class="diia-bg" aria-hidden="true">
    <div class="diia-layer layer-state-1" id="diiaLayer1"></div>
    <div class="diia-layer layer-state-2" id="diiaLayer2"></div>
  </div>

  <main class="demo-content">
    <div class="card">
      <h1>Перелив 4 секунди</h1>
      <p>Верхній м'ятно-кремовий та нижній лавандовий плавно міняються місцями по діагоналі кожні 4 секунди.</p>
    </div>
  </main>

  <script>
    (() => {
      const layer1 = document.getElementById('diiaLayer1');
      const layer2 = document.getElementById('diiaLayer2');
      if (!layer1 || !layer2) return;

      // Тривалість переходу від стану 1 до стану 2 — 4000 мс (4 секунди)
      const halfPeriodMs = 4000;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      const maxShift = 28; // М'який зсув при нахилі чи русі миші (в пікселях)

      window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });

      const handleOrientation = (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gamma = Math.max(-35, Math.min(35, e.gamma));
        const beta = Math.max(-35, Math.min(35, e.beta - 45));
        targetX = gamma / 35;
        targetY = beta / 35;
      };

      const initGyro = () => {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          DeviceOrientationEvent.requestPermission()
            .then((state) => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation, { passive: true });
              }
            })
            .catch(() => {});
        } else {
          window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        }
        window.removeEventListener('touchstart', initGyro);
      };

      window.addEventListener('touchstart', initGyro, { passive: true });

      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission !== 'function'
      ) {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
      }

      const animate = (now) => {
        // Плавна синусоїдальна хвиля: від 0 до 1 за 4 секунди, і від 1 до 0 за наступні 4 секунди
        const phase = (now / halfPeriodMs) * Math.PI;
        const blend = (1 - Math.cos(phase)) * 0.5; // 0 -> 1 -> 0 з плавним уповільненням на краях

        layer2.style.opacity = blend.toFixed(4);

        // Невелике дихання масштабу та зсув від гіроскопа/миші
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;

        const shiftX1 = (currentX * maxShift + Math.sin(phase) * 14).toFixed(2);
        const shiftY1 = (currentY * maxShift + Math.cos(phase) * 10).toFixed(2);

        const shiftX2 = (-currentX * maxShift * 0.8 - Math.sin(phase) * 14).toFixed(2);
        const shiftY2 = (-currentY * maxShift * 0.8 - Math.cos(phase) * 10).toFixed(2);

        layer1.style.transform = `translate3d(${shiftX1}px, ${shiftY1}px, 0)`;
        layer2.style.transform = `translate3d(${shiftX2}px, ${shiftY2}px, 0)`;

        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
